[project]
name = "news-auto-agent"
version = "0.1.0"
description = "news-auto-agent: 每日科技 RSS 自动选题生成中文技术博客；热点新闻选 2 则生成热点解读"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepagents",
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langsmith>=0.3.0",
    "langchain-ollama",
    "langchain-openai",
    "ollama",
    "python-dotenv",
]

[tool.uv]
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
